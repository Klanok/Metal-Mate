[package]
name = "metal-mate"
version = "0.1.5"
description = "Desktop 3D sheet metal modeller: unfold to flat, DXF for the laser"
authors = ["Metal Mate"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "metal_mate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
