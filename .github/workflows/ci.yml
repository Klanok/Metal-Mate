name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  core-and-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Golden DXF files are byte-compared; a diff here means the export
      # changed and needs re-approving with UPDATE_GOLDEN=1.
      - run: npm test
      - run: npm run build

  tauri-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # Linux webview dependencies. macOS and Windows need nothing extra.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # `cargo check` also validates tauri.conf.json and the capability files,
      # which is most of what can go wrong in a shell this thin.
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml
