name: Web demo

# Publishes the app to GitHub Pages, so it can be shown to someone by sending
# them a link instead of an unsigned installer and a SmartScreen warning.
#
# The web build is the same bundle the desktop app runs, minus the Rust shell:
# saving and opening fall back to a download and a file picker. It is a demo,
# not a replacement — the installer is still how the tool gets used.
#
# To take it down: Settings -> Pages -> Source -> None, or delete this file.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; never cancel one half way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # `configure-pages` turns Pages on through the API, which needs write here
    # as well as in the deploy job.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The demo is a public URL, so it gets the same gate as an installer.
      - run: npm test

      - name: Build for the Pages subpath
        # Pages serves from https://<owner>.github.io/<repo>/, so every asset
        # URL — the WASM kernel included — has to be rewritten to match.
        run: npm run build -w @metal-mate/app
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on the first time this runs, rather than needing someone
          # to find the setting.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
